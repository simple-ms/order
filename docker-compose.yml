services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: auth
    volumes:
      - ./app:/app/app
    ports:
      - "8001:8000"
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
