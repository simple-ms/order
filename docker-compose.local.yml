services:
  order-api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: order-api
    image: order-api
    volumes:
      - ./app:/app/app
    ports:
      - "8004:8000"
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      - order-db
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/order/health || exit 1" ]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  order-db:
    image: postgres:17
    container_name: order-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
      # - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  order-db-data:
    name: order-db-data
